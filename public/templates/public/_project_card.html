{% load i18n markdown_extras %}
<div class="col">
    <a href="{% url 'public:project_detail' slug=project.slug %}"
       class="card h-100 project-card text-decoration-none"
       aria-label="{% blocktrans with name=project.name %}Read more about {{ name }}{% endblocktrans %}">
        <div class="card-body p-4" role="group" aria-label="{% blocktrans with name=project.name %}Project card for {{ name }}{% endblocktrans %}">
            <div class="d-flex align-items-start justify-content-between mb-3">
                {% if project.logo_url %}
                <div class="project-logo">
                    <img src="{{ project.logo_url }}" alt="{{ project.name }}">
                </div>
                {% else %}
                <div class="project-logo-placeholder" aria-hidden="true">
                    {{ project.name|truncatechars:1 }}
                </div>
                {% endif %}
                {% if score %}
                <span class="score-badge score-{{ score|floatformat:0 }}" aria-label="{% blocktrans with value=score|floatformat:1 %}Score: {{ value }}{% endblocktrans %}">{{ score }}</span>
                {% endif %}
            </div>
            <h5 class="card-title text-dark mb-1">{{ project.name }}</h5>
            {% if overview %}
            <p class="card-text text-muted small mb-2">{{ overview|strip_markdown|truncatewords:12 }}</p>
            {% endif %}
            <span class="read-more" aria-hidden="true">{% trans "Read more" %} &rarr;</span>
        </div>
    </a>
</div>
