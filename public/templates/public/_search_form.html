{% load i18n %}
<form method="get" action="{% url 'public:search' %}" class="input-group">
    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
    <input type="text"
           name="q"
           class="form-control border-start-0"
           placeholder="{% trans 'Search projects, tags, or keywords...' %}"
           aria-label="{% trans 'Search projects' %}"
           value="{{ request.GET.q }}" {# Preserve search query on subsequent searches #}
           required>
</form>
